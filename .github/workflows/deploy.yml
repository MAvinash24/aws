name: Secure AWS deployment

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'deliverables/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-production
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ap-south-1
  AWS_REGION: ap-south-1
  PROJECT_NAME: devsecops-demo
  ECR_NAME: devsecops-demo
  ECR_URI: ${{ vars.ECR_URI }}
  BOUNDARY_ARN: ${{ vars.BOUNDARY_ARN }}
  EXECUTION_ROLE_ARN: ${{ vars.EXECUTION_ROLE_ARN }}
  TASK_ROLE_ARN: ${{ vars.TASK_ROLE_ARN }}
  IAM_ROLE_SUFFIXES: host,task,execution,build,deploy,pipeline,github-build,github-deploy
  RELEASE_SOURCE: ${{ github.sha }}
  RELEASE_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    name: Scan, build and sign
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: build
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned security tools
        env:
          TOOLS_BIN_DIR: .tools
        run: |
          bash scripts/install-tools.sh
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - name: Unit tests and security gates
        run: bash scripts/security-gates.sh
      - name: Assume scoped build role
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ap-south-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-build-${{ github.run_id }}
      - name: Validate deployed IAM policies
        run: python scripts/validate-iam.py
      - name: Build, scan, publish and sign exact digest
        run: bash scripts/build-publish.sh
      - name: Save immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 7
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Verify and deploy to ECS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout matching source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install verifier
        run: |
          python -m pip install --disable-pip-version-check boto3==1.35.49
          python scripts/install-binaries.py --only cosign --output .tools
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - name: Download this run's release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release
      - name: Assume separate deployment role
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-deploy-${{ github.run_id }}
      - name: Validate deployed IAM policies
        run: python scripts/validate-iam.py
      - name: Verify signature and hardened task, then deploy
        env:
          RELEASE_DIR: .release
        run: python scripts/deploy.py
      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7
